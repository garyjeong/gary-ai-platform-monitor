<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings — AI Platform Monitor</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="settings-page">
    <header class="top framed">
      <div>
        <h1>Settings</h1>
        <p class="sub">플랫폼별 모니터링 · 앱 옵션</p>
      </div>
      <div class="actions">
        <button type="button" class="icon-btn" id="btn-refresh" title="Refresh" aria-label="Refresh">↻</button>
      </div>
    </header>

    <section class="settings-block">
      <h2>App</h2>
      <label class="row">
        <span>Health poll interval</span>
        <select id="health-interval">
          <option value="10">10s</option>
          <option value="15">15s</option>
          <option value="30" selected>30s</option>
          <option value="60">60s</option>
        </select>
      </label>
      <label class="row toggle-row">
        <span>Open at login</span>
        <input type="checkbox" id="open-at-login" />
      </label>
      <label class="row toggle-row">
        <span>Read browser cookies (Grok / Cursor)</span>
        <input type="checkbox" id="browser-cookies" />
      </label>
      <p class="hint">
        알림은 보내지 않습니다. Health 는 공개 status 페이지만 폴링합니다.
      </p>
    </section>

    <section class="settings-block">
      <h2>Platforms</h2>
      <p class="hint tight">
        <strong>Monitor</strong> 를 켠 플랫폼만 상태 패널에 표시됩니다.
        미감지 플랫폼도 토글은 가능하지만 데이터가 없을 수 있습니다.
      </p>
      <div id="provider-settings" class="provider-settings"></div>
    </section>

    <script src="./settings.js" type="module"></script>
  </body>
</html>
