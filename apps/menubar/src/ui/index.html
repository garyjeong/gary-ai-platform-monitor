<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Platform Monitor</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <h1>Platforms</h1>
        <p class="sub" id="updated">—</p>
      </div>
      <div class="actions">
        <button type="button" id="btn-refresh" title="Refresh">↻</button>
        <button type="button" id="btn-settings" title="Settings">⚙</button>
        <button type="button" id="btn-quit" title="Quit" class="ghost">✕</button>
      </div>
    </header>

    <p class="summary-meta" id="summary-meta">Loading…</p>

    <section class="list" id="providers"></section>

    <footer class="footer-hint">
      각 플랫폼 사용량은 카드별로 확인합니다. 모니터링 on/off 는 설정에서 변경하세요.
    </footer>

    <script src="./app.js" type="module"></script>
  </body>
</html>
