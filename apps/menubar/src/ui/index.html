<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Platform Monitor</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <h1>AI 사용량</h1>
        <p class="sub" id="updated">—</p>
      </div>
      <div class="actions">
        <button type="button" class="icon-btn" id="btn-refresh" title="새로고침" aria-label="새로고침">↻</button>
        <button type="button" class="icon-btn" id="btn-settings" title="설정" aria-label="설정">⚙</button>
        <button type="button" class="icon-btn ghost" id="btn-close" title="닫기 (앱은 계속 실행)" aria-label="닫기">✕</button>
      </div>
    </header>

    <p class="summary-meta" id="summary-meta" role="status" aria-live="polite">불러오는 중…</p>

    <section class="list" id="providers"></section>

    <footer class="footer-hint">
      설정에서 켠 플랫폼만 표시됩니다. 종료는 메뉴 막대 아이콘 우클릭.
    </footer>

    <script src="./app.js" type="module"></script>
  </body>
</html>
