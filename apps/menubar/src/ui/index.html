<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 사용량</title>
    <link rel="stylesheet" href="./components.css" />
    <link rel="stylesheet" href="./shell.css" />
  </head>
  <body class="surface-popover">
    <div class="popover material" id="popover">
      <header class="popover-header">
        <h1 class="popover-title">AI 사용량</h1>
        <p class="popover-state" id="state" role="status" aria-live="polite"><span>불러오는 중…</span></p>
      </header>
      <div class="popover-list" id="list"></div>
      <footer class="popover-footer">
        <button type="button" class="pbtn" id="btn-settings" title="설정 (⌘,)"><svg class="ic" aria-hidden="true"><use href="#i-gear"/></svg><span>설정</span></button>
        <label class="pswitch" for="widget-toggle">위젯 표시<input id="widget-toggle" type="checkbox" role="switch" class="switch switch--mini" /></label>
        <button type="button" class="pbtn pbtn--icon" id="btn-more" aria-haspopup="menu" aria-label="더 보기" title="더 보기"><svg class="ic" aria-hidden="true"><use href="#i-more"/></svg></button>
      </footer>
    </div>
    <script src="./components.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
