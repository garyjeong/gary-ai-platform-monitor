<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Platform Monitor</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <h1>Platforms</h1>
        <p class="sub" id="updated">—</p>
      </div>
      <div class="actions">
        <button type="button" class="icon-btn" id="btn-refresh" title="Refresh" aria-label="Refresh">↻</button>
        <button type="button" class="icon-btn" id="btn-settings" title="Settings" aria-label="Settings">⚙</button>
        <button type="button" class="icon-btn ghost" id="btn-quit" title="Quit" aria-label="Quit">✕</button>
      </div>
    </header>

    <p class="summary-meta" id="summary-meta">Loading…</p>

    <section class="list" id="providers"></section>

    <footer class="footer-hint">
      설정에서 켠 플랫폼만 표시됩니다 (사용량 + health).
    </footer>

    <script src="./app.js" type="module"></script>
  </body>
</html>
